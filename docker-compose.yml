services:
  # Local development stack only. Production dependencies must stay private
  # and receive credentials from the deployment secret manager.
  postgres:
    image: postgres:16
    container_name: wiz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wizytowka}
      POSTGRES_USER: ${POSTGRES_USER:-wiz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wiz_user} -d ${POSTGRES_DB:-wizytowka}"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["dev"]

  mongo:
    image: mongo:7
    container_name: wiz-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username '$${MONGO_INITDB_ROOT_USERNAME}' --password '$${MONGO_INITDB_ROOT_PASSWORD}' --eval 'db.runCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 3s
      retries: 12
    profiles: ["dev"]

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: wiz-backend
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wiz_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wizytowka}
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}@mongo:27017
      MONGODB_DB: ${MONGODB_DB:-wizytowka}
      FRONTEND_URL: http://localhost:3000
      TRUST_PROXY: "false"
      THROTTLE_STORAGE: mongo
      INTERNAL_PROXY_SHARED_SECRET: ${INTERNAL_PROXY_SHARED_SECRET:?Set INTERNAL_PROXY_SHARED_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    profiles: ["dev"]

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: wiz-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:4000
      BACKEND_GRAPHQL_URL: http://backend:4000/graphql
      INTERNAL_PROXY_SHARED_SECRET: ${INTERNAL_PROXY_SHARED_SECRET:?Set INTERNAL_PROXY_SHARED_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["dev"]

  # === Development Tools ===
  mongo-express:
    image: mongo-express:1
    container_name: wiz-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?Set MONGO_EXPRESS_PASSWORD}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ["admin"]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: wiz-mailhog
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI
    profiles: ["dev", "dev-mail"]

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: wiz-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["admin"]

volumes:
  pgdata: {}
  mongodata: {}
