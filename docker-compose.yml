version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: wiz-postgres
    environment:
      POSTGRES_DB: wizytowka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wizytowka"]
      interval: 5s
      timeout: 3s
      retries: 20

  # === NoSQL dla "kafelków" ===
  mongo:
    image: mongo:7
    container_name: wiz-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--username", "root", "--password", "root", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 3s
      retries: 12

  # (opcjonalnie) GUI do Mongo: http://localhost:8081
  mongo-express:
    image: mongo-express:1
    container_name: wiz-mongo-express
    profiles: ["admin"]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy

  # (opcjonalnie) podgląd maili w dev: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: wiz-mailhog
    profiles: ["dev-mail"]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # (opcjonalnie) podgląd Postgresa: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: wiz-pgadmin
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: {}
  mongodata: {}
