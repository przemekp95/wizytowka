version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    groups:
      npm-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    groups:
      gha-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      gha-major:
        patterns:
          - "*"
        update-types:
          - "major"
