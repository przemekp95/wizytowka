name: Release Flow Guard

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  release_flow_guard:
    name: release-flow-guard
    runs-on: ubuntu-latest
    steps:
      - name: Validate release flow
        run: |
          set -euo pipefail
          echo "base_ref=${{ github.base_ref }}"
          echo "head_ref=${{ github.head_ref }}"
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "Release flow guard applies only to PRs targeting 'main'."
            exit 0
          fi

          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Only PRs from 'dev' to 'main' are allowed."
            exit 1
          fi
