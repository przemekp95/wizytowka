# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wizytowka
          POSTGRES_USER: wiz
          POSTGRES_PASSWORD: wiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wiz -d wizytowka"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Backend użyje tego DSN w krokach prisma/testów
      DATABASE_URL: postgresql://wiz:wiz@localhost:5432/wizytowka?schema=public
      NODE_ENV: test
      # Minimalny SMTP stub (żeby testy nie wybuchały jeśli dotykają maila)
      SMTP_HOST: localhost
      SMTP_PORT: 25
      SMTP_SECURE: false
      SMTP_FROM: test@example.com
      SMTP_TO: test@example.com
      ADMIN_TOKEN: test-token
      FRONTEND_URL: http://localhost:3000
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      # ---- Prisma (backend) ----
      - name: Prisma generate
        run: pnpm -F backend exec prisma generate

      - name: Prisma migrate deploy
        run: pnpm -F backend exec prisma migrate deploy

      # ---- Lint ----
      - name: Lint backend
        run: pnpm -F backend lint

      - name: Lint frontend
        run: pnpm -F frontend lint || true

      # ---- Tests ----
      - name: Unit tests (backend)
        run: pnpm -F backend test

      - name: E2E tests (backend)
        run: pnpm -F backend test:e2e

      - name: Frontend tests
        run: pnpm -F frontend test



