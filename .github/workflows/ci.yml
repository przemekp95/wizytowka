# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write          # push do GHCR
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/przemekp95/wizytowka-backend
  IMAGE_FRONTEND: ghcr.io/przemekp95/wizytowka-frontend
  KUSTOMIZE_DIR: k8s

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wizytowka
          POSTGRES_USER: wiz
          POSTGRES_PASSWORD: wiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wiz -d wizytowka"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://wiz:wiz@localhost:5432/wizytowka?schema=public
      NODE_ENV: test
      SMTP_HOST: localhost
      SMTP_PORT: 25
      SMTP_SECURE: false
      SMTP_FROM: test@example.com
      SMTP_TO: test@example.com
      ADMIN_TOKEN: test-token
      FRONTEND_URL: http://localhost:3000
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Najpierw pnpm (żeby cache='pnpm' w setup-node nie wywalił się szukając pnpm)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      # ---- Prisma (backend) ----
      - name: Prisma generate
        run: pnpm -F backend exec prisma generate

      - name: Prisma migrate deploy
        run: pnpm -F backend exec prisma migrate deploy

      # ---- Lint ----
      - name: Lint backend
        run: pnpm -F backend lint

      - name: Lint frontend
        run: pnpm -F frontend lint || true

      # ---- Tests ----
      - name: Unit tests (backend)
        run: pnpm -F backend test

      - name: E2E tests (backend)
        run: pnpm -F backend test:e2e

      - name: Frontend tests
        run: pnpm -F frontend test

  build_and_deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          echo "TAG_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "TAG_LATEST=latest"        >> $GITHUB_OUTPUT

      # --- Build & push to GHCR ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.TAG_LATEST }}
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.TAG_SHA }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.TAG_LATEST }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.TAG_SHA }}

      # --- kubectl apply -k ---
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          echo "${KUBE_CONFIG}" | base64 -d > $HOME/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      # (Opcjonalnie) upewnij się, że SA ma imagePullSecret do GHCR
      - name: Ensure imagePullSecret on default SA
        run: |
          kubectl -n wiz get secret ghcr-creds >/dev/null 2>&1 || kubectl -n wiz create secret docker-registry ghcr-creds \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --docker-email="none@example.com" || true
          kubectl -n wiz patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr-creds"}]}' || true

      # Używamy kustomize; newTag=latest jest w k8s/kustomization.yaml
      - name: Deploy with Kustomize
        run: |
          kubectl -n wiz apply -k ${{ env.KUSTOMIZE_DIR }}
          kubectl -n wiz rollout status deploy/backend
          kubectl -n wiz rollout status deploy/frontend
