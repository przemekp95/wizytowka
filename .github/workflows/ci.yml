# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/wizytowka-backend-ci
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/wizytowka-frontend-ci
  KUSTOMIZE_DIR: k8s

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wizytowka
          POSTGRES_USER: wiz
          POSTGRES_PASSWORD: wiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wiz -d wizytowka"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://wiz:wiz@localhost:5432/wizytowka?schema=public
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: wizytowka
      NODE_ENV: test
      SMTP_HOST: localhost
      SMTP_PORT: 25
      SMTP_SECURE: false
      SMTP_FROM: test@example.com
      SMTP_TO: test@example.com
      ADMIN_TOKEN: test-token
      FRONTEND_URL: http://localhost:3000
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres & Mongo
        run: |
          for i in {1..60}; do
            (nc -z localhost 5432) && (nc -z localhost 27017) && break
            echo "Waiting for DBs... ($i/60)"; sleep 2
          done

      # ---- Prisma (backend) ----
      - name: Prisma generate
        run: pnpm -F backend exec prisma generate

      - name: Prisma migrate deploy
        run: pnpm -F backend exec prisma migrate deploy

      # ---- Lint ----
      - name: Lint backend
        run: pnpm -F backend lint

      - name: Lint frontend
        run: pnpm -F frontend lint || true

      # ---- Tests ----
      - name: Unit tests (backend)
        run: pnpm -F backend test

      - name: E2E tests (backend)
        run: pnpm -F backend test:e2e

      - name: Frontend tests
        run: pnpm -F frontend test

  build_and_deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    env:
      # (opcjonalnie) ustaw, jeśli kubeconfig nie ma current-context
      KUBE_CONTEXT: ${{ secrets.KUBE_CONTEXT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          echo "TAG_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "TAG_LATEST=latest"        >> $GITHUB_OUTPUT

      # --- Build & push to GHCR ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.TAG_LATEST }}
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.TAG_SHA }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.TAG_LATEST }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.TAG_SHA }}

      # --- kubectl apply -k ---
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }} # base64 LUB plaintext kubeconfig
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          # Spróbuj zdekodować base64; jeśli się nie powiedzie, przyjmij plaintext
          if echo "$KUBE_CONFIG" | base64 -d >/dev/null 2>&1; then
            echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          else
            echo "$KUBE_CONFIG" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

          echo ">>> kubectl config get-contexts"
          kubectl config get-contexts || true

          if [ -n "${KUBE_CONTEXT:-}" ]; then
            echo ">>> using context: $KUBE_CONTEXT"
            kubectl config use-context "$KUBE_CONTEXT"
          fi

          echo ">>> cluster-info"
          kubectl cluster-info

      - name: Deploy with Kustomize
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        run: |
          # Walidację OpenAPI wyłączamy (czasem clustery blokują /openapi)
          kubectl -n wiz apply -k ${{ env.KUSTOMIZE_DIR }} --validate=false
          kubectl -n wiz rollout status deploy/backend
          kubectl -n wiz rollout status deploy/frontend
