name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: true  # pnpm install w całym repo (pnpm-workspace.yaml)

      # --- Lint ---
      - name: Lint backend
        run: pnpm -F backend lint
      - name: Lint frontend
        run: pnpm -F frontend lint || true  # jeśli nie masz jeszcze lint w front, usuń "|| true"

      # --- Testy backend ---
      - name: Unit tests (backend)
        run: pnpm -F backend test

      - name: E2E tests (backend)
        run: pnpm -F backend test:e2e

      # --- Testy frontend ---
      - name: Frontend tests (RTL/Vitest)
        run: pnpm -F frontend test
