# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # ⬇️ usuń cache: pnpm – to on powodował błąd

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true   # robi pnpm install w monorepo (na podstawie pnpm-workspace.yaml)

      # --- Lint ---
      - name: Lint backend
        run: pnpm -F backend lint

      - name: Lint frontend
        run: pnpm -F frontend lint || true

      # --- Testy backend ---
      - name: Unit tests (backend)
        run: pnpm -F backend test

      - name: E2E tests (backend)
        run: pnpm -F backend test:e2e

      # --- Testy frontend ---
      - name: Frontend tests (RTL/Vitest)
        run: pnpm -F frontend test


