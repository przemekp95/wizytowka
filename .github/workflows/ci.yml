name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/wizytowka-backend-ci
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/wizytowka-frontend-ci
  KUSTOMIZE_DIR: k8s
  SKIP_PRISMA: true

jobs:
  backend_test:
    name: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -F backend exec prisma generate --schema prisma/schema.prisma
      - name: Lint backend
        run: pnpm -F backend lint

      - name: Typecheck backend
        run: pnpm -F backend typecheck

      - name: Run backend tests with coverage
        run: |
          mkdir -p backend/reports
          pnpm -F backend run test:cov -- --ci --runInBand --coverageReporters=text-summary --coverageReporters=lcov --coverageReporters=json-summary --json --outputFile=reports/jest-results.json 2>&1 | tee backend/reports/jest.log

      - name: Run backend BDD scenarios
        run: pnpm -F backend test:bdd

      - name: Backend coverage summary
        if: always()
        run: |
          if [ ! -f backend/coverage/coverage-summary.json ]; then
            echo "## Backend Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage summary not available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'EOF'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('backend/coverage/coverage-summary.json', 'utf8')).total;
          const line = `| backend | ${summary.lines.pct}% | ${summary.statements.pct}% | ${summary.functions.pct}% | ${summary.branches.pct}% |`;
          const output = [
            '## Backend Coverage',
            '',
            '| Project | Lines | Statements | Functions | Branches |',
            '|---|---:|---:|---:|---:|',
            line,
            ''
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, output);
          console.log(output);
          EOF

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-artifacts
          if-no-files-found: warn
          path: |
            backend/reports/**
            backend/coverage/**

  frontend_test:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm -F frontend lint

      - name: Typecheck frontend
        run: pnpm -F frontend typecheck

      - name: Run frontend tests with coverage
        run: |
          mkdir -p frontend/reports
          pnpm -F frontend exec vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=lcov --coverage.reporter=json-summary --reporter=default --reporter=json --outputFile=reports/vitest-results.json 2>&1 | tee frontend/reports/vitest.log

      - name: Frontend coverage summary
        if: always()
        run: |
          if [ ! -f frontend/coverage/coverage-summary.json ]; then
            echo "## Frontend Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage summary not available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'EOF'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('frontend/coverage/coverage-summary.json', 'utf8')).total;
          const line = `| frontend | ${summary.lines.pct}% | ${summary.statements.pct}% | ${summary.functions.pct}% | ${summary.branches.pct}% |`;
          const output = [
            '## Frontend Coverage',
            '',
            '| Project | Lines | Statements | Functions | Branches |',
            '|---|---:|---:|---:|---:|',
            line,
            ''
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, output);
          console.log(output);
          EOF

      - name: Upload frontend test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-artifacts
          if-no-files-found: warn
          path: |
            frontend/reports/**
            frontend/coverage/**

  app_build:
    name: app-build
    needs: [backend_test, frontend_test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -F backend exec prisma generate --schema prisma/schema.prisma
      - name: Build apps
        run: pnpm -r build

  build_and_push:
    needs: [backend_test, frontend_test, app_build]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
